<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빼빼로데이 사이트가 이사했어요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e; --red-d:#9c0c24; --choc:#4a2312; --choc-l:#6b3a1f; --cookie:#e6b46a; --pink:#ffe3e8; --ink:#2b1a14}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:var(--red);
  min-height:100vh; display:grid; place-items:center; padding:24px 16px;
}
main{
  width:100%; max-width:520px; background:var(--pink); border-radius:28px; padding:36px 24px 32px;
  text-align:center; box-shadow:0 8px 0 var(--red-d);
}
h1{margin:0; font-size:clamp(28px,7.5vw,40px); line-height:1.25; font-weight:400; color:var(--red)}
p{margin:14px 0 0; font-size:clamp(16px,4.2vw,19px); line-height:1.6}
.pepero{
  display:flex; width:min(78%,300px); height:22px; margin:26px auto 4px; border-radius:999px; overflow:hidden;
  box-shadow:0 3px 0 rgba(0,0,0,.15);
}
.pepero i{display:block}
.pepero .choc{flex:72; background:
  radial-gradient(circle at 20% 30%, #ffd6e0 0 2px, transparent 2.5px) 0 0/22px 14px,
  radial-gradient(circle at 70% 70%, #fff 0 2px, transparent 2.5px) 7px 5px/26px 16px,
  linear-gradient(180deg,var(--choc-l),var(--choc) 60%)}
.pepero .cookie{flex:28; background:
  repeating-linear-gradient(90deg,rgba(150,90,20,.18) 0 2px,transparent 2px 7px),
  linear-gradient(180deg,#f3cf8c,var(--cookie))}
.go{
  display:inline-block; margin-top:26px; padding:14px 30px; border-radius:999px; background:var(--red); color:#fff;
  font-size:clamp(18px,4.8vw,22px); text-decoration:none; box-shadow:0 5px 0 var(--red-d);
}
.go:active{transform:translateY(3px); box-shadow:0 2px 0 var(--red-d)}
.go:focus-visible{outline:3px solid #ffd23f; outline-offset:3px}
.url{margin-top:18px; font-size:13px; color:#8a6a62; word-break:break-all}
.url a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>사이트가 새 주소로<br>이사했어요</h1>
  <div class="pepero" aria-hidden="true"><i class="choc"></i><i class="cookie"></i></div>
  <p>이용해 주셔서 고마워요.<br>수정해서 새 주소로 다시 열었으니,<br>아래 트윗에서 새 주소를 확인해 주세요.</p>
  <a class="go" href="https://x.com/baetyong_100/status/2120846683051602380" target="_blank" rel="noopener noreferrer">트윗에서 새 주소 보기</a>
  <div class="url">버튼이 안 열리면 이 주소를 복사해서 열어 주세요.<br>
    <a href="https://x.com/baetyong_100/status/2120846683051602380" target="_blank" rel="noopener noreferrer">x.com/baetyong_100/status/2120846683051602380</a></div>
</main>
</body>
</html>
